  <style>
    html, body { height: 100%; }
    body { overflow: hidden; overscroll-behavior: none; }

    /* Keynote 식 라이즈 인 */
    @keyframes rise {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-rise {
      opacity: 0;
      animation: rise .75s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    /* 슬라이드 전환 */
    @keyframes slideFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .animate-slide-fade { animation: slideFade .45s ease forwards; }

    /* 배경 글로우 */
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50%      { transform: translate3d(3%, -4%, 0) scale(1.08); }
    }
    .animate-drift { animation: drift 18s ease-in-out infinite; }

    /* 스크롤바 감추기 (슬라이드 내부 오버플로우용) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 모션 최소화 선호 존중 */
    @media (prefers-reduced-motion: reduce) {
      .animate-rise, .animate-slide-fade, .animate-drift {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>

      for (let i = 0; i < pp.length; i++) {

          params[pp[i].slice(1)] = decodeURIComponent(cp[i]);
        } else if (pp[i] !== cp[i]) {
          return null;
        }
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath());

      useEffect(() => {
        const onHashChange = () => setPath(getHashPath());
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      const value = useMemo(() => ({ path, navigate, params: {} }), [path, navigate]);

      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    function Routes({ children }) {
      const { path, navigate } = useRouter();
      const routes = React.Children.toArray(children);

      let matched = null;
      let params = {};
      let fallback = null;

      for (const route of routes) {
        if (route.props.path === '*') { fallback = route; continue; }
        const result = matchRoute(route.props.path, path);
        if (result) { matched = route; params = result; break; }
      }

      const active = matched || fallback;
      if (!active) return null;

      return (
        <RouterContext.Provider value={{ path, navigate, params }}>
          {active.props.element}
        </RouterContext.Provider>
      );
    }

            </div>
          </Rise>
        </SlideShell>
      );
    }

    function ClosingSlide({ onGo }) {
      return (
        <SlideShell theme="dark">
          <AccentGlow color="#FF375F" />
          <div className="relative text-center">
            <Rise delay={0.05}>
              <h2 className="text-[clamp(2.5rem,9vw,7rem)] font-bold leading-[0.95] tracking-[-0.045em]">
                재료 8개.
                <br />
                <span className="text-white/35">팬 하나. 15분.</span>
              </h2>
            </Rise>

            <Rise delay={0.25}>
              <p className="mx-auto mt-8 max-w-lg text-[clamp(0.95rem,1.8vw,1.2rem)] font-light leading-relaxed text-white/50">
                거창한 장비도, 특별한 재료도 필요 없습니다.
                기름에 향을 옮기고, 달걀을 덜 익히고, 마지막엔 불을 끄는 것.
                그게 전부입니다.
              </p>
            </Rise>

            <Rise delay={0.42}>
              <div className="mt-12 flex flex-wrap items-center justify-center gap-3">
                <Button size="lg" onClick={() => onGo(2)}>레시피 다시 보기</Button>
                <Button size="lg" variant="secondary" onClick={() => onGo(1)}>처음으로</Button>
              </div>
            </Rise>

            <Rise delay={0.58}>
              <p className="mt-16 text-xs tracking-[0.2em] text-white/25">WEEKLY 1 · 15분 레시피 5선</p>
            </Rise>
          </div>
        </SlideShell>
      );
    }

    function SlideRenderer({ slide, onGo }) {
      switch (slide.type) {
        case 'cover':         return <CoverSlide />;
        case 'overview':      return <OverviewSlide onGo={onGo} />;
        case 'principles':    return <PrinciplesSlide />;
        case 'recipe-hero':   return <RecipeHeroSlide recipe={slide.recipe} />;
        case 'recipe-detail': return <RecipeDetailSlide recipe={slide.recipe} />;
        case 'compare':       return <CompareSlide />;
        case 'closing':       return <ClosingSlide onGo={onGo} />;
        default:              return null;
      }
    }

    // ========================================
    // 📄 Page: Deck
    // ========================================
    function DeckPage() {
      const { navigate } = useRouter();
      const params = useParams();

      const parsed = parseInt(params.index, 10);
      const current = Number.isFinite(parsed)
        ? Math.min(TOTAL_SLIDES, Math.max(1, parsed))
        : 1;

      const slide = SLIDES[current - 1];

      const [overviewOpen, setOverviewOpen] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const touchStartX = useRef(null);

      const goTo = useCallback((n) => {
        const clamped = Math.min(TOTAL_SLIDES, Math.max(1, n));
        setOverviewOpen(false);
        navigate('/' + clamped);
      }, [navigate]);

      const goNext = useCallback(() => goTo(current + 1), [goTo, current]);
      const goPrev = useCallback(() => goTo(current - 1), [goTo, current]);

      const toggleFullscreen = useCallback(() => {
        try {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        } catch (e) {
          /* 전체화면 미지원 환경은 무시 */
        }
      }, []);

      // 키보드 내비게이션
      useEffect(() => {
        const onKey = (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;

          switch (e.key) {
            case 'ArrowRight':
            case 'PageDown':
            case ' ':
              e.preventDefault(); goNext(); break;
            case 'ArrowLeft':
            case 'PageUp':
              e.preventDefault(); goPrev(); break;
            case 'Home':
              e.preventDefault(); goTo(1); break;
            case 'End':
              e.preventDefault(); goTo(TOTAL_SLIDES); break;
            case 'o':
            case 'O':
              e.preventDefault(); setOverviewOpen(v => !v); break;
            case 'f':
            case 'F':
              e.preventDefault(); toggleFullscreen(); break;
            default:
              break;
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [goNext, goPrev, goTo, toggleFullscreen]);

      // 전체화면 상태 추적
      useEffect(() => {
        const onChange = () => setIsFullscreen(Boolean(document.fullscreenElement));
        document.addEventListener('fullscreenchange', onChange);
        return () => document.removeEventListener('fullscreenchange', onChange);
      }, []);

      // 터치 스와이프
      const onTouchStart = (e) => { touchStartX.current = e.changedTouches[0].clientX; };
      const onTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX.current;
        if (Math.abs(dx) > 60) { dx < 0 ? goNext() : goPrev(); }
        touchStartX.current = null;
      };

      return (
        <div
          className={`relative ${slide.theme === 'dark' ? 'bg-black' : 'bg-mist'} transition-colors duration-500`}
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          <TopProgress current={current} total={TOTAL_SLIDES} />

          {/* key 로 리마운트해 진입 애니메이션을 매번 재생 */}
          <div key={slide.id} className="animate-slide-fade">
            <SlideRenderer slide={slide} onGo={goTo} />
          </div>

          <SlideDots current={current} total={TOTAL_SLIDES} theme={slide.theme} onGo={goTo} />

          <Controls
            current={current}
            total={TOTAL_SLIDES}
            theme={slide.theme}
            onPrev={goPrev}
            onNext={goNext}
            onOpenOverview={() => setOverviewOpen(true)}
            onToggleFullscreen={toggleFullscreen}
            isFullscreen={isFullscreen}
          />

          <Modal isOpen={overviewOpen} onClose={() => setOverviewOpen(false)} title="전체 슬라이드">
            <div className="grid gap-2.5 sm:grid-cols-2 lg:grid-cols-3">
              {SLIDES.map((s, i) => {
                const n = i + 1;
                const active = n === current;
                return (
                  <button
                    key={s.id}
                    onClick={() => goTo(n)}
                    aria-current={active ? 'true' : undefined}
                    className={`flex items-center gap-3 rounded-2xl px-4 py-3.5 text-left transition ${
                      active ? 'bg-link text-white' : 'bg-white/5 text-white/70 hover:bg-white/10'
                    }`}
                  >
                    <span className="w-6 shrink-0 text-[11px] font-semibold tabular-nums opacity-60">
                      {String(n).padStart(2, '0')}
                    </span>
                    <span className="truncate text-[13px] font-medium">{s.navTitle}</span>
                  </button>
                );
              })}
            </div>
            <p className="mt-6 text-[11px] leading-relaxed text-white/30">
              ← → 이동 · Space 다음 · Home / End 처음 · 끝 · O 전체 보기 · F 전체화면
            </p>
          </Modal>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <Router>
          <Routes>
            <Route path="/" element={<DeckPage />} />
            <Route path="/:index" element={<DeckPage />} />
            <Route path="*" element={<DeckPage />} />
          </Routes>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
