<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="지브리풍 알리오 올리오 썸네일">
  <title>15분 알리오 올리오</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE3EF"/>
      <stop offset="55%" stop-color="#DCEFF0"/>
      <stop offset="100%" stop-color="#F3E7C8"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EEDC"/>
      <stop offset="100%" stop-color="#EFDFC4"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C79765"/>
      <stop offset="100%" stop-color="#A97647"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="100%" stop-color="#E4DACB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF3D0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF3D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6DC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF6DC" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <clipPath id="windowClip">
      <rect x="742" y="70" width="380" height="290" rx="14"/>
    </clipPath>
    <clipPath id="bowlClip">
      <path d="M228 386 h404 a202 96 0 0 1 -404 0 z"/>
    </clipPath>
  </defs>

  <!-- 배경 벽 -->
  <rect width="1200" height="630" fill="url(#wall)"/>

  <!-- 창문 -->
  <g>
    <rect x="730" y="58" width="404" height="314" rx="20" fill="#B98A5C"/>
    <rect x="742" y="70" width="380" height="290" rx="14" fill="url(#sky)"/>
    <g clip-path="url(#windowClip)" filter="url(#wash)">
      <!-- 먼 언덕 -->
      <path d="M742 268 q70 -58 148 -30 q64 22 118 -14 q60 -40 114 6 v130 h-380 z" fill="#9CC7A0"/>
      <path d="M742 300 q92 -46 176 -8 q78 34 204 -18 v86 h-380 z" fill="#7BAE7F"/>
      <path d="M742 330 q120 -26 210 6 q80 26 170 -6 v30 h-380 z" fill="#5F9469"/>
      <!-- 구름 -->
      <g fill="#FFFFFF" opacity="0.92">
        <ellipse cx="836" cy="132" rx="46" ry="21"/>
        <ellipse cx="872" cy="124" rx="34" ry="24"/>
        <ellipse cx="808" cy="126" rx="26" ry="16"/>
        <ellipse cx="1020" cy="180" rx="40" ry="18"/>
        <ellipse cx="1052" cy="174" rx="28" ry="20"/>
      </g>
      <!-- 새 -->
      <g stroke="#5A6B72" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M944 116 q8 -8 16 0 q8 -8 16 0"/>
        <path d="M990 96 q6 -6 12 0 q6 -6 12 0"/>
      </g>
      <!-- 나무 한 그루 -->
      <path d="M1058 336 v-42" stroke="#7A5A3A" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="1058" cy="286" rx="34" ry="28" fill="#4F8A57"/>
      <ellipse cx="1040" cy="296" rx="22" ry="18" fill="#5E9C63"/>
    </g>
    <!-- 창살 -->
    <g stroke="#B98A5C" stroke-width="12" stroke-linecap="round">
      <path d="M932 70 v290"/>
      <path d="M742 215 h380"/>
    </g>
    <rect x="742" y="70" width="380" height="290" rx="14" fill="none" stroke="#8E653F" stroke-width="4" opacity="0.35"/>
  </g>

  <!-- 창에서 들어오는 빛 -->
  <g opacity="0.75">
    <path d="M742 90 L300 630 L560 630 L1000 92 Z" fill="url(#ray)"/>
    <path d="M960 100 L640 630 L760 630 L1080 104 Z" fill="url(#ray)" opacity="0.6"/>
  </g>
  <ellipse cx="430" cy="420" rx="330" ry="180" fill="url(#glow)" filter="url(#soft)"/>

  <!-- 테이블 -->
  <path d="M0 470 h1200 v160 h-1200 z" fill="url(#table)"/>
  <g stroke="#8E653F" stroke-width="2" opacity="0.35" fill="none">
    <path d="M0 512 q300 -10 600 0 t600 0"/>
    <path d="M0 556 q280 12 560 0 t640 0"/>
    <path d="M0 600 q340 -8 620 2 t580 -2"/>
  </g>
  <rect x="0" y="466" width="1200" height="10" fill="#DCB27F"/>

  <!-- 접시 그림자 -->
  <ellipse cx="430" cy="470" rx="238" ry="34" fill="#7C5732" opacity="0.28" filter="url(#soft)"/>

  <!-- 그릇 -->
  <g>
    <ellipse cx="430" cy="386" rx="212" ry="74" fill="#EFE6D6"/>
    <path d="M218 386 h424 a212 100 0 0 1 -424 0 z" fill="url(#bowl)"/>
    <ellipse cx="430" cy="386" rx="212" ry="74" fill="none" stroke="#6E9FC4" stroke-width="7" opacity="0.85"/>
    <ellipse cx="430" cy="386" rx="188" ry="62" fill="#F4EADA"/>
    <!-- 그릇 안쪽 그늘 -->
    <path d="M242 386 a188 62 0 0 0 376 0 z" fill="#E6D9C4" opacity="0.55"/>
  </g>

  <!-- 파스타 면 -->
  <g clip-path="url(#bowlClip)">
    <ellipse cx="430" cy="382" rx="164" ry="54" fill="#E8B44F"/>
    <ellipse cx="430" cy="374" rx="150" ry="46" fill="#F2C86A"/>
    <g fill="none" stroke="#E0A93F" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <path d="M300 380 q56 -46 130 -40 q80 6 106 44"/>
      <path d="M312 398 q60 -56 128 -46 q76 10 100 50"/>
      <path d="M330 356 q46 -34 106 -30 q64 6 92 34"/>
      <path d="M292 366 q52 -56 142 -52"/>
      <path d="M356 344 q56 -22 116 -6"/>
      <path d="M338 410 q66 -30 148 -14"/>
    </g>
    <g fill="none" stroke="#FBDC97" stroke-width="6" stroke-linecap="round">
      <path d="M306 372 q60 -50 132 -42 q76 8 104 46"/>
      <path d="M322 390 q58 -48 124 -40 q72 8 98 44"/>
      <path d="M348 350 q50 -28 108 -22 q58 8 84 30"/>
      <path d="M368 336 q52 -16 104 -2"/>
      <path d="M330 404 q68 -28 146 -12"/>
    </g>
    <!-- 흘러내린 면 한 가닥 -->
    <path d="M470 386 q56 26 84 66" fill="none" stroke="#F2C86A" stroke-width="6" stroke-linecap="round"/>

    <!-- 볶은 마늘 편 -->
    <g>
      <ellipse cx="372" cy="368" rx="17" ry="11" fill="#F6E7C4" stroke="#D9A441" stroke-width="3" transform="rotate(-14 372 368)"/>
      <ellipse cx="452" cy="352" rx="16" ry="10" fill="#F9EDD2" stroke="#D9A441" stroke-width="3" transform="rotate(9 452 352)"/>
      <ellipse cx="416" cy="398" rx="18" ry="11" fill="#F3E1BC" stroke="#C89033" stroke-width="3" transform="rotate(-6 416 398)"/>
      <ellipse cx="504" cy="382" rx="15" ry="10" fill="#F9EDD2" stroke="#D9A441" stroke-width="3" transform="rotate(18 504 382)"/>
    </g>
    <!-- 페페론치노 -->
    <path d="M340 340 q22 10 40 2" fill="none" stroke="#D2564A" stroke-width="7" stroke-linecap="round"/>
    <path d="M486 340 q18 -12 38 -6" fill="none" stroke="#C94F45" stroke-width="7" stroke-linecap="round"/>
    <!-- 파슬리 -->
    <g fill="#4F8A4A" opacity="0.9">
      <circle cx="390" cy="344" r="4"/>
      <circle cx="438" cy="330" r="3.4"/>
      <circle cx="478" cy="366" r="3.8"/>
      <circle cx="356" cy="392" r="3.4"/>
      <circle cx="500" cy="404" r="3.2"/>
      <circle cx="418" cy="368" r="3"/>
    </g>
  </g>

  <!-- 김 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.5">
    <path d="M366 296 q-24 -40 6 -76 q26 -32 4 -64"/>
    <path d="M440 282 q-22 -44 8 -82 q28 -34 6 -68"/>
    <path d="M512 300 q-20 -38 8 -72 q24 -30 6 -58"/>
  </g>

  <!-- 테이블 위 소품: 마늘 통 -->
  <g transform="translate(694 424)">
    <ellipse cx="0" cy="34" rx="52" ry="12" fill="#7C5732" opacity="0.28"/>
    <path d="M-42 8 q6 -50 42 -54 q36 4 42 54 q-42 26 -84 0 z" fill="#F7F1E4" stroke="#D8C7A8" stroke-width="3"/>
    <g stroke="#D8C7A8" stroke-width="3" fill="none">
      <path d="M-14 -44 q-8 34 -6 56"/>
      <path d="M14 -44 q8 34 6 56"/>
    </g>
    <path d="M0 -46 q-4 -18 10 -26" fill="none" stroke="#B49A6E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 테이블 위 소품: 올리브유 병 -->
  <g transform="translate(148 356)">
    <ellipse cx="0" cy="112" rx="46" ry="12" fill="#7C5732" opacity="0.28"/>
    <path d="M-32 108 v-58 q0 -22 12 -34 v-22 h40 v22 q12 12 12 34 v58 a10 10 0 0 1 -10 10 h-44 a10 10 0 0 1 -10 -10 z" fill="#B4C98A" opacity="0.92" stroke="#8FAB68" stroke-width="3"/>
    <path d="M-32 60 h64 v48 a10 10 0 0 1 -10 10 h-44 a10 10 0 0 1 -10 -10 z" fill="#D8A83A" opacity="0.85"/>
    <rect x="-11" y="-30" width="22" height="16" rx="4" fill="#8A6A3E"/>
    <rect x="-24" y="66" width="48" height="26" rx="4" fill="#F7F1E4" opacity="0.9"/>
  </g>

  <!-- 포크 -->
  <g transform="translate(760 520) rotate(-8)" fill="#CFD6DA" stroke="#A9B4BA" stroke-width="2">
    <rect x="0" y="-5" width="150" height="10" rx="5"/>
    <path d="M-46 -16 v14 M-32 -18 v16 M-18 -16 v14"/>
    <path d="M-52 -2 h56 q8 0 8 7 t-8 7 h-56 z"/>
  </g>

  <!-- 텍스트 -->
  <g>
    <rect x="72" y="500" width="386" height="86" rx="20" fill="#FFFAEE" opacity="0.94" stroke="#D9C7A3" stroke-width="3"/>
    <text x="98" y="540" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="38" font-weight="700" fill="#5A4326">15분 알리오 올리오</text>
    <text x="98" y="570" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" fill="#8A7554">마늘 · 올리브유 · 면 세 가지면 충분한 한 접시</text>
  </g>

  <!-- 수채 종이 질감 -->
  <rect width="1200" height="630" filter="url(#paper)" opacity="0.12" style="mix-blend-mode:multiply"/>
  <!-- 비네트 -->
  <rect width="1200" height="630" fill="none" stroke="#8E6B44" stroke-width="16" opacity="0.12"/>
</svg>
