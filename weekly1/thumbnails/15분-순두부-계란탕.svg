<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="지브리풍 순두부 계란탕 썸네일">
  <title>15분 순두부 계란탕</title>
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DBFD6"/>
      <stop offset="55%" stop-color="#C9DDE4"/>
      <stop offset="100%" stop-color="#E9E3D0"/>
    </linearGradient>
    <linearGradient id="wall4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EBDA"/>
      <stop offset="100%" stop-color="#E5D8BE"/>
    </linearGradient>
    <linearGradient id="table4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BC8F5F"/>
      <stop offset="100%" stop-color="#9A6E42"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4A33"/>
      <stop offset="100%" stop-color="#41291B"/>
    </linearGradient>
    <radialGradient id="broth" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#E4633A"/>
      <stop offset="70%" stop-color="#C64426"/>
      <stop offset="100%" stop-color="#A2331B"/>
    </radialGradient>
    <radialGradient id="glow4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFEFCB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFEFCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5DC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF5DC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="paper4"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <filter id="wash4" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="win4"><rect x="742" y="70" width="380" height="290" rx="14"/></clipPath>
    <clipPath id="brothClip"><ellipse cx="430" cy="374" rx="170" ry="66"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#wall4)"/>

  <!-- 창문: 비 오는 날 -->
  <g>
    <rect x="730" y="58" width="404" height="314" rx="20" fill="#9E7448"/>
    <rect x="742" y="70" width="380" height="290" rx="14" fill="url(#sky4)"/>
    <g clip-path="url(#win4)" filter="url(#wash4)">
      <path d="M742 268 q80 -52 156 -22 q72 28 132 -12 q58 -36 92 8 v122 h-380 z" fill="#8FAE96"/>
      <path d="M742 304 q100 -38 194 -2 q86 32 186 -16 v84 h-380 z" fill="#6E9179"/>
      <g fill="#FFFFFF" opacity="0.75">
        <ellipse cx="840" cy="128" rx="54" ry="20"/>
        <ellipse cx="884" cy="120" rx="34" ry="22"/>
        <ellipse cx="1030" cy="158" rx="46" ry="18"/>
      </g>
      <!-- 빗줄기 -->
      <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5">
        <path d="M780 96 l-14 44"/><path d="M836 112 l-14 44"/><path d="M892 90 l-14 44"/>
        <path d="M962 118 l-14 44"/><path d="M1016 96 l-14 44"/><path d="M1078 124 l-14 44"/>
        <path d="M804 170 l-12 38"/><path d="M990 182 l-12 38"/><path d="M1054 196 l-12 38"/>
      </g>
    </g>
    <!-- 유리에 맺힌 물방울 -->
    <g fill="#FFFFFF" opacity="0.35">
      <ellipse cx="794" cy="300" rx="7" ry="10"/>
      <ellipse cx="826" cy="332" rx="5" ry="8"/>
      <ellipse cx="1044" cy="286" rx="6" ry="9"/>
      <ellipse cx="1078" cy="322" rx="4" ry="7"/>
    </g>
    <g stroke="#9E7448" stroke-width="12" stroke-linecap="round">
      <path d="M932 70 v290"/><path d="M742 215 h380"/>
    </g>
  </g>

  <g opacity="0.6"><path d="M742 94 L300 630 L560 630 L1000 96 Z" fill="url(#ray4)"/></g>
  <ellipse cx="430" cy="410" rx="320" ry="175" fill="url(#glow4)" filter="url(#soft4)"/>

  <!-- 테이블 -->
  <path d="M0 470 h1200 v160 h-1200 z" fill="url(#table4)"/>
  <g stroke="#7F5A32" stroke-width="2" opacity="0.35" fill="none">
    <path d="M0 514 q300 -10 600 0 t600 0"/>
    <path d="M0 560 q280 12 560 0 t640 0"/>
    <path d="M0 604 q340 -8 620 2 t580 -2"/>
  </g>
  <rect x="0" y="466" width="1200" height="10" fill="#D3A876"/>

  <!-- 나무 받침 -->
  <g>
    <ellipse cx="430" cy="462" rx="252" ry="46" fill="#7A5433"/>
    <ellipse cx="430" cy="454" rx="252" ry="46" fill="#96693F"/>
    <ellipse cx="430" cy="454" rx="228" ry="38" fill="#A87A4C"/>
  </g>

  <!-- 뚝배기 -->
  <g>
    <ellipse cx="430" cy="392" rx="200" ry="86" fill="#33200F"/>
    <path d="M232 372 q0 92 198 92 q198 0 198 -92 z" fill="url(#pot)"/>
    <!-- 손잡이 -->
    <path d="M622 372 q46 -6 44 26 q-2 30 -44 24" fill="none" stroke="#5A3B27" stroke-width="16" stroke-linecap="round"/>
    <path d="M238 372 q-46 -6 -44 26 q2 30 44 24" fill="none" stroke="#5A3B27" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="430" cy="372" rx="198" ry="82" fill="#7A5638"/>
    <ellipse cx="430" cy="372" rx="180" ry="72" fill="#4E3320"/>
    <!-- 뚝배기 질감 -->
    <g stroke="#8E6A48" stroke-width="3" opacity="0.4" fill="none">
      <path d="M260 412 q170 56 340 0"/>
      <path d="M276 434 q154 44 308 0"/>
    </g>
  </g>

  <!-- 국물 -->
  <g clip-path="url(#brothClip)">
    <ellipse cx="430" cy="374" rx="170" ry="66" fill="url(#broth)"/>
    <!-- 기름방울 -->
    <g fill="#F2A03A" opacity="0.7">
      <ellipse cx="330" cy="352" rx="16" ry="8"/>
      <ellipse cx="500" cy="392" rx="20" ry="9"/>
      <ellipse cx="386" cy="406" rx="12" ry="6"/>
      <ellipse cx="466" cy="340" rx="11" ry="6"/>
      <ellipse cx="298" cy="394" rx="9" ry="5"/>
    </g>
    <!-- 계란 줄기 -->
    <g fill="#FFE08A" opacity="0.95">
      <path d="M300 380 q40 -22 84 -6 q-32 22 -84 6 z"/>
      <path d="M420 342 q46 -18 88 4 q-42 20 -88 -4 z"/>
      <path d="M366 410 q52 -16 100 6 q-50 18 -100 -6 z"/>
    </g>
    <!-- 순두부 덩어리 -->
    <g fill="#FBF6EC" stroke="#E7DCC9" stroke-width="3">
      <path d="M318 336 q34 -22 64 -4 q22 26 -8 42 q-38 16 -62 -8 q-14 -20 6 -30 z"/>
      <path d="M440 380 q38 -24 70 -2 q22 24 -10 40 q-40 16 -66 -10 q-12 -18 6 -28 z"/>
      <path d="M336 400 q32 -18 58 0 q18 22 -8 34 q-34 14 -56 -8 q-10 -16 6 -26 z"/>
      <path d="M486 330 q30 -16 54 2 q16 20 -8 32 q-32 12 -52 -8 q-8 -16 6 -26 z"/>
    </g>
    <!-- 대파 -->
    <g fill="#5E9C4F" stroke="#3F7336" stroke-width="2">
      <ellipse cx="404" cy="366" rx="12" ry="7" transform="rotate(-18 404 366)"/>
      <ellipse cx="478" cy="410" rx="11" ry="6" transform="rotate(12 478 410)"/>
      <ellipse cx="342" cy="384" rx="11" ry="6" transform="rotate(-4 342 384)"/>
      <ellipse cx="540" cy="368" rx="10" ry="6" transform="rotate(20 540 368)"/>
    </g>
  </g>
  <ellipse cx="430" cy="374" rx="170" ry="66" fill="none" stroke="#3A2413" stroke-width="4" opacity="0.4"/>

  <!-- 김 (국물 요리라 크게) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5">
    <path d="M336 282 q-28 -46 6 -84 q28 -34 4 -70"/>
    <path d="M430 262 q-26 -50 10 -92 q30 -36 6 -74"/>
    <path d="M524 286 q-24 -42 10 -78 q26 -30 6 -62"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3">
    <path d="M382 300 q-18 -34 4 -60"/>
    <path d="M480 300 q-16 -32 6 -58"/>
  </g>

  <!-- 밥공기 -->
  <g transform="translate(846 452)">
    <ellipse cx="0" cy="56" rx="86" ry="18" fill="#6E4A28" opacity="0.28"/>
    <path d="M-78 6 q10 58 78 58 q68 0 78 -58 z" fill="#EFE5D2" stroke="#CDBFA4" stroke-width="3"/>
    <ellipse cx="0" cy="6" rx="78" ry="26" fill="#F8F2E4" stroke="#CDBFA4" stroke-width="3"/>
    <path d="M-62 2 q18 -34 62 -34 q44 0 62 34 q-58 22 -124 0 z" fill="#FFFDF6"/>
    <g fill="#EFE7D4" opacity="0.9">
      <ellipse cx="-24" cy="-12" rx="9" ry="5" transform="rotate(-16 -24 -12)"/>
      <ellipse cx="14" cy="-18" rx="9" ry="5" transform="rotate(10 14 -18)"/>
      <ellipse cx="40" cy="-4" rx="9" ry="5" transform="rotate(-6 40 -4)"/>
    </g>
  </g>

  <!-- 숟가락 -->
  <g transform="translate(126 494) rotate(6)" fill="#CFD6DA" stroke="#A9B4BA" stroke-width="2">
    <rect x="30" y="-5" width="140" height="10" rx="5"/>
    <ellipse cx="8" cy="0" rx="26" ry="17"/>
  </g>

  <!-- 텍스트 -->
  <g>
    <rect x="72" y="516" width="384" height="86" rx="20" fill="#FFFAEE" opacity="0.94" stroke="#D9C7A3" stroke-width="3"/>
    <text x="98" y="556" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="38" font-weight="700" fill="#5A4326">15분 순두부 계란탕</text>
    <text x="98" y="586" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" fill="#8A7554">칼질 없이 냄비 하나로 끝나는 국물 한 그릇</text>
  </g>

  <rect width="1200" height="630" filter="url(#paper4)" opacity="0.12" style="mix-blend-mode:multiply"/>
  <rect width="1200" height="630" fill="none" stroke="#8E6B44" stroke-width="16" opacity="0.12"/>
</svg>
