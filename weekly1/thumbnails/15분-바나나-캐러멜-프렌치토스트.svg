    <text x="86" y="553" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" fill="#5A4326">15분 바나나 캐러멜 프렌치토스트</text>
    <text x="86" y="583" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" fill="#8A7554">오븐 없이 프라이팬 하나로 끝나는 디저트</text>
  </g>

  <rect width="1200" height="630" filter="url(#paper5)" opacity="0.12" style="mix-blend-mode:multiply"/>
  <rect width="1200" height="630" fill="none" stroke="#8E6B44" stroke-width="16" opacity="0.12"/>
</svg>
