      <path d="M742 276 q76 -50 150 -20 q70 28 130 -12 q56 -34 100 10 v116 h-380 z" fill="#A6CFA2"/>
      <path d="M742 310 q100 -38 194 -2 q86 32 186 -16 v78 h-380 z" fill="#7EB37C"/>
      <!-- 빨래줄 -->
      <path d="M742 196 q190 26 380 -8" fill="none" stroke="#B49A6E" stroke-width="3"/>
