    <circle cx="308" cy="288" r="3"/><circle cx="366" cy="232" r="2.6"/><circle cx="420" cy="308" r="2.4"/>
    <circle cx="466" cy="212" r="3"/><circle cx="528" cy="262" r="2.6"/><circle cx="566" cy="322" r="2.4"/>
    <circle cx="284" cy="330" r="2.6"/><circle cx="342" cy="326" r="2.2"/><circle cx="504" cy="336" r="2.2"/>
