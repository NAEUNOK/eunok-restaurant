    <path d="M-34 50 q-16 -56 26 -84 q10 -4 12 6 q-32 26 -22 76 q24 14 56 2 q6 8 -4 12 q-48 12 -68 -12 z" fill="#F6DA72" stroke="#C79B27" stroke-width="4"/>
