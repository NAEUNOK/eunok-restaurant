    <path d="M-36 -30 h72 l-8 118 a8 8 0 0 1 -8 6 h-40 a8 8 0 0 1 -8 -6 z" fill="#EAF0F2" opacity="0.55" stroke="#CBD8DC" stroke-width="3"/>
    <path d="M-32 6 h64 l-6 82 a8 8 0 0 1 -8 6 h-36 a8 8 0 0 1 -8 -6 z" fill="#FDFBF6"/>
    <ellipse cx="0" cy="6" rx="32" ry="9" fill="#FFFFFF"/>
    <ellipse cx="0" cy="-30" rx="36" ry="10" fill="none" stroke="#CBD8DC" stroke-width="3"/>
    <path d="M-24 -18 l-4 92" stroke="#FFFFFF" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
