  <g fill="url(#caramel)">
    <path d="M290 322 q34 -12 70 -6 q40 8 84 0 q46 -10 88 4 q42 12 72 2 q6 20 -30 26 q-40 8 -76 -2 q-44 -12 -88 -2 q-42 10 -80 0 q-38 -10 -40 -22 z"/>
