<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="지브리풍 바나나 캐러멜 프렌치토스트 썸네일">
  <title>15분 바나나 캐러멜 프렌치토스트</title>
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDE6F0"/>
      <stop offset="50%" stop-color="#EAF3E8"/>
      <stop offset="100%" stop-color="#FBF2D6"/>
    </linearGradient>
    <linearGradient id="wall5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E2"/>
      <stop offset="100%" stop-color="#F0E2C8"/>
    </linearGradient>
    <linearGradient id="table5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBA377"/>
      <stop offset="100%" stop-color="#AC8151"/>
    </linearGradient>
    <linearGradient id="toastTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B96B"/>
      <stop offset="50%" stop-color="#D89E45"/>
      <stop offset="100%" stop-color="#C4842F"/>
    </linearGradient>
    <linearGradient id="toastSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6E3B8"/>
      <stop offset="100%" stop-color="#E2C489"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D98E33"/>
      <stop offset="100%" stop-color="#A85F16"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF2CE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF2CE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF8E2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft5" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="paper5"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <filter id="wash5" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="17" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="win5"><rect x="742" y="70" width="380" height="290" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#wall5)"/>

