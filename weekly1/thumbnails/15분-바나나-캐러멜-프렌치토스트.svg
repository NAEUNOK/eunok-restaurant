  </g>

  <g opacity="0.8"><path d="M742 92 L300 630 L560 630 L1000 94 Z" fill="url(#ray5)"/></g>
  <ellipse cx="430" cy="410" rx="330" ry="180" fill="url(#glow5)" filter="url(#soft5)"/>

