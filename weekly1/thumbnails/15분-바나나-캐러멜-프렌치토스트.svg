    <ellipse cx="430" cy="446" rx="268" ry="52" fill="none" stroke="#E3D6BC" stroke-width="3"/>
    <ellipse cx="430" cy="446" rx="238" ry="42" fill="none" stroke="#E9DDC5" stroke-width="2" stroke-dasharray="8 10"/>
