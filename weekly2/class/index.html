<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 만나이 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease-out; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ children, className = "" }) {
      return (
        <div className={`bg-white rounded-2xl shadow-md border border-slate-100 p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function Button({ children, variant = "primary", size = "md", disabled = false, onClick, className = "" }) {
      const base = "inline-flex items-center justify-center font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500",
        secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-400",
        ghost: "bg-transparent text-indigo-600 hover:bg-indigo-50 focus:ring-indigo-400",
      };
      const sizes = {
        sm: "text-sm px-3 py-1.5",
        md: "text-sm sm:text-base px-4 py-2.5",
        lg: "text-base sm:text-lg px-6 py-3",
      };
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, type = "text", value, onChange, placeholder, error, id }) {
      return (
        <div className="w-full">
          {label && (
            <label htmlFor={id} className="block text-sm font-medium text-slate-700 mb-1.5">
              {label}
            </label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            aria-invalid={!!error}
            className={`w-full rounded-lg border px-4 py-2.5 text-slate-900 shadow-sm focus:outline-none focus:ring-2 transition-colors
              ${error ? "border-red-400 focus:ring-red-300" : "border-slate-300 focus:ring-indigo-400 focus:border-indigo-400"}`}
          />
          {error && <p className="mt-1.5 text-sm text-red-600">{error}</p>}
        </div>
      );
    }

    function StatBadge({ label, value, unit, highlight = false }) {
      return (
        <div
          className={`rounded-xl p-5 text-center border ${
            highlight ? "bg-indigo-600 border-indigo-600" : "bg-slate-50 border-slate-100"
          }`}
        >
          <p className={`text-sm mb-1 ${highlight ? "text-indigo-100" : "text-slate-500"}`}>{label}</p>
          <p className={`text-3xl sm:text-4xl font-bold ${highlight ? "text-white" : "text-slate-800"}`}>
            {value}
            {unit && <span className="text-lg font-medium ml-1">{unit}</span>}
          </p>
        </div>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    function AgeCalculatorPage() {
      const todayStr = useMemo(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }, []);

      const [birthDate, setBirthDate] = useState("");
      const [refDate, setRefDate] = useState(todayStr);
      const [error, setError] = useState("");

      const handleBirthChange = useCallback((e) => {
        setBirthDate(e.target.value);
        setError("");
      }, []);

      const handleRefChange = useCallback((e) => {
        setRefDate(e.target.value);
        setError("");
      }, []);

      const result = useMemo(() => {
        if (!birthDate || !refDate) return null;

        const birth = new Date(birthDate + "T00:00:00");
        const ref = new Date(refDate + "T00:00:00");

        if (isNaN(birth.getTime())) return null;
        if (birth.getTime() > ref.getTime()) {
          setError("생년월일은 기준일보다 이전이어야 해요.");
          return null;
        }

        // 만 나이 (International / Korean legal age since 2023)
        let manAge = ref.getFullYear() - birth.getFullYear();
        const hasHadBirthdayThisYear =
          ref.getMonth() > birth.getMonth() ||
          (ref.getMonth() === birth.getMonth() && ref.getDate() >= birth.getDate());
        if (!hasHadBirthdayThisYear) manAge -= 1;

        // 연 나이 (한국 행정상 나이: 기준연도 - 출생연도)
        const yeonAge = ref.getFullYear() - birth.getFullYear();

        // 세는 나이 (전통적 한국 나이: 연 나이 + 1)
        const senoonAge = yeonAge + 1;

        // 다음 생일까지 D-day
        let nextBirthday = new Date(ref.getFullYear(), birth.getMonth(), birth.getDate());
        if (nextBirthday.getTime() < ref.getTime()) {
          nextBirthday = new Date(ref.getFullYear() + 1, birth.getMonth(), birth.getDate());
        }
        const msPerDay = 1000 * 60 * 60 * 24;
        const dDay = Math.round((nextBirthday.getTime() - ref.getTime()) / msPerDay);

        return { manAge, yeonAge, senoonAge, dDay, hasHadBirthdayThisYear };
      }, [birthDate, refDate]);

      const handleReset = useCallback(() => {
        setBirthDate("");
        setRefDate(todayStr);
        setError("");
      }, [todayStr]);

      return (
        <div className="min-h-screen flex items-start sm:items-center justify-center px-4 py-10 sm:py-16">
          <div className="w-full max-w-xl">
            <div className="text-center mb-8">
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">🎂 한국 만나이 계산기</h1>
              <p className="mt-2 text-slate-500 text-sm sm:text-base">
                생년월일을 입력하면 만 나이, 연 나이, 세는 나이를 한 번에 계산해드려요.
              </p>
            </div>

            <Card>
              <div className="space-y-4">
                <Input
                  id="birthDate"
                  type="date"
                  label="생년월일"
                  value={birthDate}
                  onChange={handleBirthChange}
                  error={error}
                />
                <Input
                  id="refDate"
                  type="date"
                  label="기준일 (기본값: 오늘)"
                  value={refDate}
                  onChange={handleRefChange}
                />

                <div className="flex gap-2 pt-1">
                  <Button variant="secondary" onClick={handleReset} className="flex-1">
                    초기화
                  </Button>
                </div>
              </div>

              {result && (
                <div className="mt-8 fade-in">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <StatBadge label="만 나이" value={result.manAge} unit="세" highlight />
                    <StatBadge label="연 나이" value={result.yeonAge} unit="세" />
                    <StatBadge label="세는 나이" value={result.senoonAge} unit="세" />
                  </div>

                  <div className="mt-4 rounded-xl bg-amber-50 border border-amber-100 p-4 text-center">
                    <p className="text-sm text-amber-800">
                      {result.dDay === 0
                        ? "🎉 오늘이 생일이에요!"
                        : `다음 생일까지 D-${result.dDay}일 남았어요`}
                    </p>
                  </div>

                  <p className="mt-4 text-xs text-slate-400 leading-relaxed">
                    * 만 나이: 2023년부터 대한민국 법적 통일 나이 기준 (생일 지나면 +1세)
                    <br />
                    * 연 나이: 병역법·청소년보호법 등에서 쓰는 &quot;기준연도 − 출생연도&quot;
                    <br />
                    * 세는 나이: 출생 시 1세, 매년 1월 1일마다 +1세 하는 전통 방식
                  </p>
                </div>
              )}

              {!result && !error && birthDate === "" && (
                <div className="mt-8 text-center text-slate-400 text-sm py-6 border-t border-slate-100">
                  생년월일을 입력해주세요
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <AgeCalculatorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
