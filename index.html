    const FRACTION_MAP = { '0.25': '¼', '0.33': '⅓', '0.5': '½', '0.67': '⅔', '0.75': '¾' };

    function formatAmount(value) {
      if (value === null || value === undefined) return '';
      const rounded = Math.round(value * 100) / 100;
      if (rounded >= 10) return String(Math.round(rounded));
      const whole = Math.floor(rounded);
      const frac = Math.round((rounded - whole) * 100) / 100;
      const key = ['0.25', '0.33', '0.5', '0.67', '0.75'].find(k => Math.abs(frac - Number(k)) < 0.03);
      if (key) return (whole > 0 ? whole + ' ' : '') + FRACTION_MAP[key];
      return String(Math.round(rounded * 10) / 10);
    }

    function formatClock(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function formatDuration(seconds) {
      return Math.round(seconds / 60) + '분';

    function playChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        [880, 1174].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const at = ctx.currentTime + i * 0.22;
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(0.25, at + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
          osc.connect(gain).connect(ctx.destination);
          osc.start(at);
          osc.stop(at + 0.4);
        });
        setTimeout(() => ctx.close(), 1400);
      } catch (e) {
        /* 오디오 미지원 환경은 조용히 무시 */
      }
    }

        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = prev;
        };
      }, [isOpen, onClose]);

        <div

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/', navigate: () => {} });

    function useRouter() {
      return useContext(RouterContext);
    }

    function useParams() {
      return useContext(RouterContext).params || {};
    }

    function getHashPath() {
      const raw = window.location.hash.replace(/^#/, '');
      return raw === '' ? '/' : raw;
    }

    function matchRoute(pattern, path) {
      if (pattern === '*') return {};
      const pp = pattern.split('/').filter(Boolean);
      const cp = path.split('/').filter(Boolean);
      if (pp.length !== cp.length) return null;
      const params = {};
      for (let i = 0; i < pp.length; i++) {
        if (pp[i].startsWith(':')) {
          params[pp[i].slice(1)] = decodeURIComponent(cp[i]);
        } else if (pp[i] !== cp[i]) {
          return null;
        }
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath());

      useEffect(() => {
        const onHashChange = () => {
          setPath(getHashPath());
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const navigate = useCallback((to) => {
        window.location.hash = to;
      }, []);

      const value = useMemo(() => ({ path, navigate, params: {} }), [path, navigate]);

      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    function Routes({ children }) {
      const { path, navigate } = useRouter();
      const routes = React.Children.toArray(children);

      let matched = null;
      let params = {};
      let fallback = null;

      for (const route of routes) {
        if (route.props.path === '*') {
          fallback = route;
          continue;
        }
        const result = matchRoute(route.props.path, path);
        if (result) {
          matched = route;
          params = result;
          break;
        }
      }

      const active = matched || fallback;
      if (!active) return null;

      return (
        <RouterContext.Provider value={{ path, navigate, params }}>
          {active.props.element}
        </RouterContext.Provider>
      );
    }

      return null;
    }

    // ========================================
    // ⏲️ Timer Hook
    // ========================================
    function useStepTimer() {
      const [activeStep, setActiveStep] = useState(null);
      const [remaining, setRemaining] = useState(0);
      const [running, setRunning] = useState(false);
      const [finished, setFinished] = useState(false);

      useEffect(() => {
        if (!running) return;
        const id = setInterval(() => {
          setRemaining(r => (r > 0 ? r - 1 : 0));
        }, 1000);
        return () => clearInterval(id);
      }, [running]);

      useEffect(() => {
        if (running && remaining === 0) {
          setRunning(false);
          setFinished(true);
          playChime();
        }
      }, [running, remaining]);

      const start = useCallback((stepIndex, seconds) => {
        setActiveStep(stepIndex);
        setRemaining(seconds);
        setFinished(false);
        setRunning(true);
      }, []);

      const stop = useCallback(() => {
        setRunning(false);
        setActiveStep(null);
        setRemaining(0);
        setFinished(false);
      }, []);

      const toggle = useCallback(() => setRunning(r => !r), []);

      return { activeStep, remaining, running, finished, start, stop, toggle };
    }

          <div className="grid gap-8 lg:grid-cols-3">
            {/* 왼쪽: 재료 */}
            <aside className="lg:col-span-1">
              <div className="lg:sticky lg:top-24">
                <Card className="print-block p-6">
                  {/* 인분 조절 */}
                  <div className="no-print mb-6">
                    <div className="mb-2 flex items-center justify-between">
                      <span className="text-sm font-bold text-char">인분</span>
                      <span className="font-display text-lg text-hell-600">{servings}인분</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <Button
                        size="sm"
                        variant="secondary"
                        onClick={() => setServings(s => Math.max(1, s - 1))}
                        disabled={servings <= 1}
                        aria-label="인분 줄이기"
                      >
                        −
                      </Button>
                      <div className="flex-1">
                        <ProgressBar value={servings} max={6} />
                      </div>
                      <Button
                        size="sm"
                        variant="secondary"
                        onClick={() => setServings(s => Math.min(6, s + 1))}
                        disabled={servings >= 6}
                        aria-label="인분 늘리기"
                      >
                        +
                      </Button>
                    </div>
                    {servings >= 5 && (
                      <p className="mt-2 text-xs text-amber-700">
                        ⚠️ 5인분 이상은 팬 두 개에 나눠 만드세요. 소스가 깊어지면 달걀이 잠깁니다.
                      </p>
                    )}
                  </div>

                  {/* 지옥 단계 */}
                  <div className="no-print mb-6 rounded-2xl bg-hell-50 p-4">
                    <div className="mb-2 flex items-center justify-between">
                      <span className="text-sm font-bold text-char">지옥 단계</span>
                      <Badge className={spice.badge}>{spice.level} · {spice.label}</Badge>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="5"
                      step="1"
                      value={spiceLevel}
                      onChange={(e) => setSpiceLevel(Number(e.target.value))}
                      className="w-full accent-hell-600"
                      aria-label="매운맛 단계 조절"
                    />
                    <p className="mt-1 text-xs text-char/50">{spice.desc}</p>
                  </div>

                  {/* 재료 목록 */}
                  <div className="mb-4 flex items-center justify-between">
                    <h2 className="font-display text-xl text-char">재료</h2>
                    <span className="text-xs font-bold text-char/40">
                      {checkedItems.size} / {totalIngredients}
                    </span>
                  </div>

                  {checkedItems.size === 0 && (
                    <p className="no-print mb-4 rounded-xl bg-hell-50 px-4 py-3 text-xs leading-relaxed text-char/50">
                      아직 체크한 재료가 없습니다. 장을 보면서 하나씩 체크해 보세요.
                    </p>
                  )}

                  <div className="space-y-5">
                    {INGREDIENT_GROUPS.map(group => (
                      <div key={group.id}>
                        <h3 className="mb-1.5 text-xs font-bold uppercase tracking-wider text-hell-600">
                          <span aria-hidden="true">{group.emoji}</span> {group.title}
                        </h3>
                        <ul className="space-y-0.5">
                          {group.items.map(item => {
                            const key = group.id + ':' + item.name;
                            return (
                              <IngredientRow
                                key={key}
                                item={item}
                                servings={servings}
                                spiceLevel={spiceLevel}
                                checked={checkedItems.has(key)}
                                onToggle={() => toggleItem(key)}
                              />
                            );
                          })}
                        </ul>
                      </div>
                    ))}
                  </div>
                </Card>
              </div>
            </aside>

            {/* 오른쪽: 조리 단계 */}
            <section className="lg:col-span-2">
              <Card className="no-print mb-6 p-6">
                <div className="mb-3 flex items-center justify-between">
                  <h2 className="font-display text-xl text-char">조리 진행</h2>
                  <span className="text-sm font-bold text-hell-600">
                    {doneSteps.size} / {STEPS.length} 단계
                  </span>
                </div>
                <ProgressBar value={doneSteps.size} max={STEPS.length} />
                <p className="mt-3 text-xs text-char/50">
                  단계 번호를 눌러 완료 표시하고, 타이머 버튼으로 시간을 재세요.
                </p>
              </Card>

              <div className="space-y-4">
                {STEPS.map((step, i) => (
                  <StepCard
                    key={step.title}
                    index={i}
                    step={step}
                    done={doneSteps.has(i)}
                    onToggleDone={() => toggleStep(i)}
                    timer={timer}
                  />
                ))}
              </div>

              <Card className="mt-8 bg-char p-7 text-white">
                <h3 className="font-display text-xl">🍽 플레이팅 한 줄</h3>
                <p className="mt-2 text-sm leading-relaxed text-white/60">
                  팬째 나무 받침에 올리고, 바게트는 따로 바구니에. 올리브유를 마지막에 한 번 더 두르면
                  표면이 반짝이면서 사진이 완전히 달라집니다.
                </p>
              </Card>
            </section>
          </div>

          <Modal isOpen={showDone} onClose={() => setShowDone(false)} title="🔥 완성했습니다!">
            <p className="text-sm leading-relaxed text-char/70">
              모든 단계를 마쳤습니다. 노른자가 흐를 때 바게트로 찍어 드세요.
              5분이 지나면 여열로 노른자가 굳으니 지금 바로 식탁으로!
            </p>
            <div className="mt-6 flex flex-wrap gap-2">
              <Link to="/variations">
                <Button>다음엔 이 버전 어때요? →</Button>
              </Link>
              <Button variant="ghost" onClick={() => setShowDone(false)}>닫기</Button>
            </div>
          </Modal>
        </div>
      );
    }

    // ========================================
    // 📄 Page: Variations
    // ========================================
    function VariationsPage() {
      const [selected, setSelected] = useState(null);

      return (
        <div className="mx-auto max-w-6xl px-5 py-12">
          <SectionTitle
            kicker="Variations"
            title="네 가지 다른 지옥"
            desc="기본 레시피의 뼈대는 그대로 두고 몇 가지 재료만 바꾸면 완전히 다른 요리가 됩니다."
          />

          <div className="grid gap-5 sm:grid-cols-2">
            {VARIATIONS.map(v => (
              <Card key={v.name} className="overflow-hidden">
                <div className={`bg-gradient-to-br ${v.color} px-7 py-8`}>
                  <span className="text-4xl" aria-hidden="true">{v.emoji}</span>
                  <h3 className="mt-3 font-display text-2xl text-char">{v.name}</h3>
                  <Badge className="mt-2 border-char/10 bg-white/70 text-char/70">{v.tag}</Badge>
                </div>
                <div className="p-7">
                  <p className="text-sm leading-relaxed text-char/60">{v.desc}</p>
                  <Button className="mt-5" size="sm" variant="secondary" onClick={() => setSelected(v)}>
                    바꿔야 할 재료 보기
                  </Button>
                </div>
              </Card>
            ))}
          </div>

          <Card className="mt-10 p-7">
            <h3 className="font-display text-xl text-char">응용의 기본 원칙</h3>
            <ul className="mt-4 space-y-3 text-sm leading-relaxed text-char/70">
              <li className="flex gap-3">
                <span className="text-hell-500" aria-hidden="true">1.</span>
                <span>수분이 많은 재료(김치, 버섯, 생크림)를 넣으면 반드시 조금 더 졸이세요. 소스가 묽으면 달걀이 가라앉습니다.</span>
              </li>
              <li className="flex gap-3">
                <span className="text-hell-500" aria-hidden="true">2.</span>
                <span>단백질을 바꿀 때는 기름이 나오는 재료(베이컨, 초리조)인지 아닌지에 따라 올리브유 양을 조절하세요.</span>
              </li>
              <li className="flex gap-3">
                <span className="text-hell-500" aria-hidden="true">3.</span>
                <span>어떤 버전이든 달걀 넣는 타이밍은 마지막에서 두 번째. 이 순서만 지키면 실패하지 않습니다.</span>
              </li>
            </ul>
          </Card>

          <Modal
            isOpen={selected !== null}
            onClose={() => setSelected(null)}
            title={selected ? selected.emoji + ' ' + selected.name : ''}
            size="md"
          >
            {selected && (
              <div>
                <p className="text-sm leading-relaxed text-char/60">{selected.desc}</p>
                <h4 className="mt-5 mb-2 text-xs font-bold uppercase tracking-wider text-hell-600">
                  기본 레시피에서 바꿀 것
                </h4>
                <ul className="space-y-2">
                  {selected.swaps.map(s => (
                    <li key={s} className="flex gap-3 rounded-xl bg-hell-50 px-4 py-3 text-sm text-char/80">
                      <span className="text-hell-500" aria-hidden="true">→</span>
                      <span>{s}</span>
                    </li>
                  ))}
                </ul>
                <div className="mt-6">
                  <Link to="/recipe">
                    <Button>기본 레시피 열기</Button>
                  </Link>
                </div>
              </div>
            )}
          </Modal>
        </div>
      );
    }

    // ========================================
    // 📄 Page: FAQ
    // ========================================
    function FaqPage() {
      const [openIndex, setOpenIndex] = useState(0);

      return (
        <div className="mx-auto max-w-3xl px-5 py-12">
          <SectionTitle
            kicker="FAQ"
            title="자주 막히는 지점들"
            desc="에그인헬에서 실패하는 이유는 거의 정해져 있습니다. 대부분 불 세기와 타이밍 문제입니다."
          />

          <div className="space-y-3">
            {FAQ.map((item, i) => (
              <AccordionItem
                key={item.q}
                question={item.q}
                answer={item.a}
                isOpen={openIndex === i}
                onToggle={() => setOpenIndex(openIndex === i ? -1 : i)}
              />
            ))}
          </div>

          <Card className="mt-10 bg-char p-8 text-center text-white">
            <p className="font-display text-2xl">그래도 실패했다면</p>
            <p className="mt-3 text-sm leading-relaxed text-white/60">
              달걀이 너무 익었다면 그냥 잘게 부숴 소스에 섞으세요. 훌륭한 파스타 소스가 됩니다.<br />
              에그인헬에 진짜 실패란 없습니다.
            </p>
            <div className="mt-6">
              <Link to="/recipe">
                <Button variant="danger">다시 도전하기 🔥</Button>
              </Link>
            </div>
          </Card>
        </div>
      );
    }

    // ========================================
    // 📄 Page: Not Found
    // ========================================
    function NotFoundPage() {
      return (
        <div className="mx-auto flex max-w-lg flex-col items-center px-5 py-28 text-center">
          <span className="animate-flicker text-6xl" aria-hidden="true">🍳</span>
          <h1 className="mt-6 font-display text-4xl text-char">여긴 지옥에도 없는 페이지</h1>
          <p className="mt-3 text-sm leading-relaxed text-char/60">
            주소를 다시 확인해 주세요. 달걀은 저쪽 팬에 있습니다.
          </p>
          <Link to="/" className="mt-7">
            <Button>홈으로 돌아가기</Button>
          </Link>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <Router>
          <div className="flex min-h-screen flex-col">
            <Header />
            <main className="flex-1">
              <Routes>
                <Route path="/" element={<HomePage />} />
                <Route path="/recipe" element={<RecipePage />} />
                <Route path="/variations" element={<VariationsPage />} />
                <Route path="/faq" element={<FaqPage />} />
                <Route path="*" element={<NotFoundPage />} />
              </Routes>
            </main>
            <Footer />
          </div>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
